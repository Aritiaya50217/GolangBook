syntax = "proto3";

option go_package = "gRPC-microservices/part02developing_testing_and_deploying_a_grpc/chapter01getting_up_and_running_with_grpc_and_golang/02backward_and_forward_compatibility/proto";

message CreatePaymentRequest {
  float price = 1;
  float vat   = 2;
}

message CreatePaymentResponse {
  float total_prce = 1;
}

service Payment {
  rpc Create(CreatePaymentRequest) returns(CreatePaymentResponse){}
}
